  <!-- dupatta drape across front -->
  <path d="M146 140Q170 170 164 230Q160 280 172 330L156 334Q146 280 148 230Q150 180 138 150Z" fill="#a51b2a" opacity=".9"/>
  <path d="M146 140Q170 170 164 230Q160 280 172 330" fill="none" stroke="url(#gold)" stroke-width="2.4"/>

  <!-- bride garland -->
