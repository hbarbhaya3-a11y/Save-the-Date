    <path d="M96 116Q92 66 124 62Q156 64 152 112Q148 80 124 76Q102 78 96 116Z" fill="url(#red)"/>
    <path d="M96 116Q92 66 124 62Q156 64 152 112" fill="none" stroke="url(#gold)" stroke-width="3"/>
