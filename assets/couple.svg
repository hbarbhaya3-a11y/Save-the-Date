    <path d="M232 70Q248 80 246 110Q244 126 238 132" fill="none" stroke="#e7d7b8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="208" cy="58" r="6" fill="url(#gold)" stroke="#8a6420" stroke-width=".6"/>
