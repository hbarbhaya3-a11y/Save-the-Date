    <path d="M124 82V90" stroke="url(#gold)" stroke-width="1.2"/>
    <circle cx="124" cy="91" r="2.4" fill="url(#gold)"/>
    <!-- earrings -->
    <circle cx="106" cy="114" r="3" fill="url(#gold)"/><circle cx="142" cy="114" r="3" fill="url(#gold)"/>
