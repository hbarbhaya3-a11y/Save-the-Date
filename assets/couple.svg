<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3202f"/>
      <stop offset="1" stop-color="#7d0f1c"/>
    </linearGradient>
    <linearGradient id="redSkirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e0f1b"/>
      <stop offset=".35" stop-color="#b1202e"/>
      <stop offset=".7" stop-color="#9d1826"/>
      <stop offset="1" stop-color="#6f0c17"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset=".6" stop-color="#f1e7d4"/>
      <stop offset="1" stop-color="#dccbac"/>
    </linearGradient>
    <linearGradient id="stole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eadbbd"/>
      <stop offset="1" stop-color="#d2bc94"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf6e"/>
      <stop offset="1" stop-color="#b98422"/>
    </linearGradient>
    <pattern id="buta" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.1" fill="#e2b04f" opacity=".85"/>
      <circle cx="12" cy="12" r="1.1" fill="#e2b04f" opacity=".85"/>
    </pattern>
  </defs>

  <!-- ================= BRIDE: dupatta behind ================= -->
  <path d="M104 70C78 84 66 120 64 160 58 260 46 340 36 430H78C82 330 88 250 98 170Z" fill="url(#red)"/>
