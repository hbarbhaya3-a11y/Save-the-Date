<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 230">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9965f"/>
      <stop offset=".45" stop-color="#f1c494"/>
      <stop offset="1" stop-color="#c98350"/>
    </linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d2ad"/>
      <stop offset="1" stop-color="#e2b285"/>
    </linearGradient>
    <!-- curvilinear spire -->
    <g id="spire">
      <path d="M-30 0V-14C-30-50-14-86 0-100 14-86 30-50 30-14V0Z" fill="url(#stone)" stroke="#a9693e" stroke-width="1"/>
      <path d="M-29-14H29M-27-30H27M-23-46H23M-18-62H18M-12-78H12M-6-90H6" stroke="#a9693e" stroke-width=".8" fill="none"/>
      <path d="M0-100V-96" stroke="#a9693e"/>
      <ellipse cx="0" cy="-102" rx="7" ry="3" fill="#c98350"/>
      <path d="M-4-104Q0-116 4-104Z" fill="#d79a2b"/>
      <path d="M0-114V-138" stroke="#7a4a2c" stroke-width="1.2"/>
      <path d="M0-138L18-132 0-126Z" fill="#ee7a2a"/>
    </g>
    <!-- small dome / chhatri -->
    <g id="dome">
      <rect x="-12" y="-14" width="24" height="14" fill="url(#stone2)" stroke="#a9693e" stroke-width=".8"/>
      <path d="M-6-14V-4M0-14V-4M6-14V-4" stroke="#a9693e" stroke-width=".7"/>
      <path d="M-14-14Q-14-32 0-36 14-32 14-14Z" fill="url(#stone)" stroke="#a9693e" stroke-width=".8"/>
      <path d="M0-36V-40" stroke="#a9693e"/>
      <circle cx="0" cy="-41" r="1.6" fill="#d79a2b"/>
      <path d="M0-42V-56" stroke="#7a4a2c" stroke-width=".9"/>
      <path d="M0-56L11-52 0-48Z" fill="#ee7a2a"/>
    </g>
  </defs>

  <!-- back spires -->
  <use xlink:href="#spire" transform="translate(76 150) scale(.62)"/>
  <use xlink:href="#spire" transform="translate(178 150) scale(.62)"/>
  <!-- main body -->
  <rect x="40" y="148" width="180" height="58" fill="url(#stone2)" stroke="#a9693e" stroke-width="1"/>
  <use xlink:href="#spire" transform="translate(128 150) scale(1.05)"/>
  <!-- mandapa domes -->
  <use xlink:href="#dome" transform="translate(56 150)"/>
  <use xlink:href="#dome" transform="translate(98 156) scale(.9)"/>
  <use xlink:href="#dome" transform="translate(160 156) scale(.9)"/>
  <use xlink:href="#dome" transform="translate(204 150)"/>
  <use xlink:href="#dome" transform="translate(22 172) scale(.8)"/>
  <use xlink:href="#dome" transform="translate(238 172) scale(.8)"/>
  <!-- arches & details -->
  <g fill="#9b5b35" opacity=".85">
    <path d="M118 206V184Q128 170 138 184V206Z"/>
    <path d="M70 200V188Q76 180 82 188V200Z"/>
    <path d="M90 200V188Q96 180 102 188V200Z"/>
    <path d="M154 200V188Q160 180 166 188V200Z"/>
    <path d="M174 200V188Q180 180 186 188V200Z"/>
  </g>
  <path d="M40 164H220M40 176H220" stroke="#b97a4c" stroke-width=".8"/>
  <g fill="#c98350">
    <circle cx="50" cy="170" r="1.4"/><circle cx="60" cy="170" r="1.4"/><circle cx="200" cy="170" r="1.4"/><circle cx="210" cy="170" r="1.4"/>
  </g>
  <rect x="10" y="180" width="240" height="26" fill="#ecc69e" stroke="#a9693e" stroke-width=".8" opacity=".9"/>
  <path d="M10 188H250" stroke="#b97a4c" stroke-width=".7"/>
  <g fill="#a9693e" opacity=".7">
    <rect x="18" y="192" width="8" height="10"/><rect x="34" y="192" width="8" height="10"/>
    <rect x="218" y="192" width="8" height="10"/><rect x="234" y="192" width="8" height="10"/>
  </g>
  <!-- steps -->
  <rect x="0" y="206" width="260" height="8" fill="#e2b285" stroke="#a9693e" stroke-width=".6"/>
  <rect x="-4" y="214" width="268" height="10" fill="#d9a678" stroke="#a9693e" stroke-width=".6"/>
</svg>
