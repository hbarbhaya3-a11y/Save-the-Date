</head>
<body>
  <main class="viewport">
    <div class="stage" id="stage" aria-live="polite">

      <!-- ============ Live background (whole reel) ============ -->
        <div class="p1-bg live-bg" id="p1Bg" aria-hidden="true">
          <img class="p1-bg__paper" src="assets/art/roses-bg.jpg" alt="" />
          <img class="bell bell1" src="assets/art/bells/bell1.png" alt="" style="left:10.946%;top:8.373%;width:7.226%" />
          <img class="bell bell2" src="assets/art/bells/bell2.png" alt="" style="left:22.104%;top:6.459%;width:6.801%" />
          <img class="bell bell3" src="assets/art/bells/bell3.png" alt="" style="left:46.546%;top:6.220%;width:6.801%" />
          <img class="bell bell4" src="assets/art/bells/bell4.png" alt="" style="left:70.988%;top:6.459%;width:6.801%" />
          <img class="bell bell5" src="assets/art/bells/bell5.png" alt="" style="left:81.615%;top:8.373%;width:7.226%" />
        </div>
      <!-- (old watercolour layer, hidden in this version) -->
      <div class="bg">
        <!-- painted artwork (assets/art/*) is used when present; the SVG drawings are the fallback -->
        <img class="art art--bg" data-art="bg" src="assets/art/background.webp" alt="" />
        <div class="wash wash--peach"></div>
        <div class="wash wash--peach2"></div>
        <div class="wash wash--lavender"></div>
        <div class="wash wash--blue"></div>
        <img class="deco deco--flower" src="../assets/flower-lineart.svg" alt="" />
        <img class="deco deco--leaves" src="../assets/leaves.svg" alt="" />
        <img class="deco deco--leaves-br" src="../assets/leaves.svg" alt="" />
        <img class="art art--florals" data-art="florals" src="assets/art/florals.webp" alt="" />
        <div class="paper-grain"></div>
      </div>

      <!-- ============ Scene 1 : calendar ============ -->
      <section class="scene scene--calendar" id="scene1">
        <h1 class="arc-title" id="arcTitle" aria-label="Save the Date"></h1>
        <div class="mini-logo" id="miniLogo"><svg class="logo__mark" viewBox="0 0 380 300" aria-hidden="true">
            <defs>
              <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
              </linearGradient>
            </defs>
            <!-- gold flourishes -->
            <g class="logo__swirl" fill="none" stroke="url(#goldA)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#goldA)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#goldA)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg></div>

        <div class="month-block">
          <div class="month" id="monthName">NOVEMBER</div>
          <div class="year" id="yearName">2026</div>
        </div>

        <div class="calendar" id="calendar" role="grid" aria-label="Calendar"></div>

        <div class="wedding-of">
          <h2 class="wedding-of__label" id="weddingLabel" aria-label="For the wedding of"></h2>
          <p class="wedding-of__names" id="coupleNames">Abhishek &amp; Deepa</p>
        </div>

        <div class="heart" id="heart" aria-hidden="true">
          <svg viewBox="0 0 64 58"><defs><radialGradient id="hg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".55" stop-color="#ee2f37"/><stop offset="1" stop-color="#c8151f"/></radialGradient></defs><path d="M32 56C14 42 2 31 2 17 2 8 9 1 18 1c6 0 11 3 14 8 3-5 8-8 14-8 9 0 16 7 16 16 0 14-12 25-30 39z" fill="url(#hg)"/><ellipse cx="17" cy="14" rx="6" ry="4" fill="#fff" opacity=".35" transform="rotate(-30 17 14)"/></svg>
        </div>

        <div class="ground ground--s1">
          <div class="photo-ground photo-ground--one" aria-hidden="true">
            <img src="assets/temple-couple.jpg" alt="Harsh and Stuti at the Jain temple" />
          </div>
        </div>
      </section>

      <!-- ============ Scene 2 : monogram ============ -->
      <section class="scene scene--monogram" id="scene2">

        <div class="monogram" id="monogram">
          <div class="logo" id="logoMain">
          <svg class="logo__mark" viewBox="0 0 380 300" aria-label="H and S monogram">
            <defs>
              <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
              </linearGradient>
            </defs>
            <!-- gold flourishes -->
            <g class="logo__swirl" fill="none" stroke="url(#goldA)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#goldA)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#goldA)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg>
          <p class="logo__names">Harsh &amp; Stuti</p>
          <svg class="logo__divider" viewBox="0 0 300 24" aria-hidden="true">
            <g fill="none" stroke="url(#goldA)" stroke-width="1.4" stroke-linecap="round">
              <path pathLength="1" d="M128 12H24C16 12 12 6 18 4M24 12C18 12 14 18 20 20"/>
              <path pathLength="1" d="M172 12H276C284 12 288 6 282 4M276 12C282 12 286 18 280 20"/>
              <path d="M128 12l-6-3M128 12l-6 3M172 12l6-3M172 12l6 3"/>
              <path d="M150 20c-6-5-10-8-10-12 0-3 2-5 5-5 2 0 4 1 5 3 1-2 3-3 5-3 3 0 5 2 5 5 0 4-4 7-10 12z" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        </div>

        <div class="final-text">
          <p class="final-text__std" id="typeSTD"><span class="tw"></span><span class="caret"></span></p>
          <p class="p1-wedof" id="p1WedOf">for the wedding of</p>
          <p class="p1-names" id="p1Names">Harsh <span class="amp">&amp;</span> Stuti</p>
        </div>
      </section>


      <!-- ============ Page 3 : closing card (everything shown at once) ============ -->
      <section class="scene scene--final" id="scene3">

        <div class="p3-card">
          <div class="p3-logo"><svg class="logo__mark" viewBox="0 0 380 300" aria-hidden="true">
            <defs>
              <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
              </linearGradient>
            </defs>
            <!-- gold flourishes -->
            <g class="logo__swirl" fill="none" stroke="url(#goldA)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#goldA)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#goldA)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg></div>
          <p class="p3-names" id="p3Names">Harsh <span class="amp">&amp;</span> Stuti</p>
          <p class="p3-std">Save the Date</p>
          <p class="p3-date" id="p3Date">30<sup>th</sup> November 2026</p>
        </div>
      </section>

      <!-- controls -->
      <button class="ctrl ctrl--replay" id="replayBtn" type="button" aria-label="Replay">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></svg>
        <span>Replay</span>
      </button>
      <button class="ctrl ctrl--sound" id="soundBtn" type="button" aria-label="Toggle music" hidden>
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
      </button>
    </div>
  </main>

  <!-- Optional background music: drop an mp3 at assets/music.mp3 -->
  <audio id="music" src="assets/music.mp3" preload="auto" loop></audio>
