<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Save the Date · Harsh &amp; Stuti</title>
  <meta name="description" content="Harsh &amp; Stuti – Save the Date – 30 November 2026" />
  <meta name="theme-color" content="#f3d9da" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- link preview (WhatsApp, Instagram, iMessage …) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Save the Date · Harsh &amp; Stuti" />
  <meta property="og:description" content="30 November 2026 · A new chapter together. Tap to open our invitation." />
  <meta property="og:url" content="https://hbarbhaya3-a11y.github.io/Save-the-Date/harsh-stuti/" />
  <meta property="og:image" content="https://hbarbhaya3-a11y.github.io/Save-the-Date/harsh-stuti/assets/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 58'%3E%3Cpath d='M32 56C14 42 2 31 2 17 2 8 9 1 18 1c6 0 11 3 14 8 3-5 8-8 14-8 9 0 16 7 16 16 0 14-12 25-30 39z' fill='%23b8506a'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/background.webp" />
  <link rel="preload" as="image" href="assets/photo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="viewport">
    <div class="stage" id="stage">

      <!-- persistent paper + florals -->
      <div class="bg">
        <img class="bg__paper" src="assets/background.webp" alt="" />
        <!-- venue photos as soft backdrops (cafe: couple + calendar, temple: names + final) -->
        <div class="bg__photo" id="bgCafe" style="background-image:url('assets/cafe.jpg')"></div>
        <div class="bg__photo" id="bgTemple" style="background-image:url('assets/temple.jpg')"></div>
        <img class="bg__floral bg__floral--tl" src="assets/florals.webp" alt="" />
        <img class="bg__floral bg__floral--br" src="assets/florals.webp" alt="" />
        <div class="petals" id="petals" aria-hidden="true"></div>
      </div>

      <!-- 0 · opening: H & S logo -->
      <section class="scene s-open" id="sOpen">
        <div class="logo" id="logoOpen">
          <svg class="logo__mark" viewBox="0 0 380 300" aria-label="H and S monogram">
            <defs>
              <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
              </linearGradient>
            </defs>
            <!-- gold flourishes -->
            <g class="logo__swirl" fill="none" stroke="url(#goldA)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#goldA)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#goldA)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg>
          <p class="logo__names">Harsh &amp; Stuti</p>
          <svg class="logo__divider" viewBox="0 0 300 24" aria-hidden="true">
            <g fill="none" stroke="url(#goldA)" stroke-width="1.4" stroke-linecap="round">
              <path pathLength="1" d="M128 12H24C16 12 12 6 18 4M24 12C18 12 14 18 20 20"/>
              <path pathLength="1" d="M172 12H276C284 12 288 6 282 4M276 12C282 12 286 18 280 20"/>
              <path d="M128 12l-6-3M128 12l-6 3M172 12l6-3M172 12l6 3"/>
              <path d="M150 20c-6-5-10-8-10-12 0-3 2-5 5-5 2 0 4 1 5 3 1-2 3-3 5-3 3 0 5 2 5 5 0 4-4 7-10 12z" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </section>

      <!-- 1 · couple moment -->
      <section class="scene s-couple" id="sCouple">
        <figure class="photo">
          <div class="photo__frame"><img src="assets/photo.jpg" alt="Harsh and Stuti" /></div>
          <img class="photo__floral" src="assets/florals.webp" alt="" />
        </figure>
        <p class="script tagline wipe" id="tagline">A new chapter together</p>
      </section>

      <!-- 2 · calendar reveal -->
      <section class="scene s-cal" id="sCal">
        <div class="cal-card" id="calCard">
          <img class="cal-card__floral" src="assets/florals.webp" alt="" />
          <p class="cal-card__title" id="calTitle">30 Nov 2026</p>
          <div class="calendar" id="calendar" role="grid" aria-label="Calendar"></div>
        </div>
        <div class="heart" id="heart" aria-hidden="true">
          <svg viewBox="0 0 64 58"><defs><radialGradient id="hg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#e9798f"/><stop offset=".55" stop-color="#c94b67"/><stop offset="1" stop-color="#a5304d"/></radialGradient></defs><path d="M32 56C14 42 2 31 2 17 2 8 9 1 18 1c6 0 11 3 14 8 3-5 8-8 14-8 9 0 16 7 16 16 0 14-12 25-30 39z" fill="url(#hg)"/><ellipse cx="17" cy="14" rx="6" ry="4" fill="#fff" opacity=".35" transform="rotate(-30 17 14)"/></svg>
        </div>
      </section>

      <!-- 3 · name reveal -->
      <section class="scene s-names" id="sNames">
        <h1 class="names">
          <span class="script names__a wipe" id="nameA">Harsh</span>
          <span class="script names__b wipe" id="nameB">&amp; Stuti</span>
        </h1>
        <p class="caps std" id="stdLine" aria-label="Save the date"></p>
        <div class="divider" id="namesDivider"><span class="line"></span><span class="dheart">♥</span><span class="line"></span></div>
        <p class="caps date rise" id="dateLine">30<sup>th</sup> NOV 2026</p>
      </section>

      <!-- 4 · location: venue photos, used as they are -->
      <section class="scene s-place" id="sPlace">
        <p class="script place__lead rise">See you at</p>
        <div class="prints">
          <figure class="print print--a">
            <img src="assets/cafe.jpg" alt="Roots Cafe" />
            <figcaption><span class="script">Roots Cafe</span></figcaption>
          </figure>
          <figure class="print print--b">
            <img src="assets/temple.jpg" alt="Shri 1008 Mallinath Digamber Jain Temple" />
            <figcaption><span class="script">Mallinath Jain Temple</span></figcaption>
          </figure>
          <figure class="print print--c">
            <img src="assets/dakshinayan.jpg" alt="Dakshinayan" />
            <figcaption><span class="script">Dakshinayan</span></figcaption>
          </figure>
        </div>
      </section>

      <!-- 5 · final card with the H & S logo -->
      <section class="scene s-final" id="sFinal">
        <div class="logo" id="logoFinal">
          <svg class="logo__mark" viewBox="0 0 380 300" aria-label="H and S monogram">
            <defs>
              <linearGradient id="goldB" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
              </linearGradient>
            </defs>
            <!-- gold flourishes -->
            <g class="logo__swirl" fill="none" stroke="url(#goldB)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#goldB)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#goldB)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg>
          <p class="logo__names">Harsh &amp; Stuti</p>
          <svg class="logo__divider" viewBox="0 0 300 24" aria-hidden="true">
            <g fill="none" stroke="url(#goldB)" stroke-width="1.4" stroke-linecap="round">
              <path pathLength="1" d="M128 12H24C16 12 12 6 18 4M24 12C18 12 14 18 20 20"/>
              <path pathLength="1" d="M172 12H276C284 12 288 6 282 4M276 12C282 12 286 18 280 20"/>
              <path d="M128 12l-6-3M128 12l-6 3M172 12l6-3M172 12l6 3"/>
              <path d="M150 20c-6-5-10-8-10-12 0-3 2-5 5-5 2 0 4 1 5 3 1-2 3-3 5-3 3 0 5 2 5 5 0 4-4 7-10 12z" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <p class="caps final__std rise">Save the Date</p>
        <p class="caps final__date rise" id="finalDate">30<sup>th</sup> November 2026</p>
        <p class="script final__tag rise">A new chapter together</p>
      </section>

      <button class="ctrl ctrl--replay" id="replayBtn" type="button" aria-label="Replay">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></svg>
        <span>Replay</span>
      </button>
      <button class="ctrl ctrl--sound" id="soundBtn" type="button" aria-label="Toggle music" hidden>
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
      </button>
    </div>
  </main>

  <!-- Optional background music: drop an mp3 at assets/music.mp3 -->
  <audio id="music" src="assets/music.mp3" preload="auto" loop></audio>
  <script src="script.js"></script>
</body>
</html>
