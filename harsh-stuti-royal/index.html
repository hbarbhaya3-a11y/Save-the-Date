<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Save the Date · Harsh &amp; Stuti</title>
  <meta name="description" content="Harsh &amp; Stuti – Save the Date – 30 November 2026" />
  <meta name="theme-color" content="#f7efe2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Save the Date · Harsh &amp; Stuti" />
  <meta property="og:description" content="30 November 2026 · Tap to open our invitation." />
  <meta property="og:url" content="https://hbarbhaya3-a11y.github.io/Save-the-Date/harsh-stuti-royal/" />
  <meta property="og:image" content="https://hbarbhaya3-a11y.github.io/Save-the-Date/harsh-stuti-royal/assets/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 58'%3E%3Cpath d='M32 56C14 42 2 31 2 17 2 8 9 1 18 1c6 0 11 3 14 8 3-5 8-8 14-8 9 0 16 7 16 16 0 14-12 25-30 39z' fill='%23b8893d'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/temple-couple.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="viewport">
    <div class="stage" id="stage">

      <!-- shared gold gradients -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9a6a24"/><stop offset=".35" stop-color="#e3c27a"/>
            <stop offset=".55" stop-color="#b8893d"/><stop offset=".8" stop-color="#f0d89a"/><stop offset="1" stop-color="#8e5f1e"/>
          </linearGradient>
          <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#bf9b6b"/><stop offset=".5" stop-color="#d8bc93"/><stop offset="1" stop-color="#b08c5e"/>
          </linearGradient>
          <clipPath id="archClip" clipPathUnits="objectBoundingBox">
            <path d="M0 1V.36C0 .2 .22 .1 .4 .06 .45 .05 .48 .03 .5 0 .52 .03 .55 .05 .6 .06 .78 .1 1 .2 1 .36V1Z"/>
          </clipPath>
        </defs>
      </svg>

      <!-- ivory paper -->
      <div class="paper"></div>

      <!-- ornamental gold frame (draws in, stays for the whole reel) -->
      <svg class="frame" id="frame" viewBox="0 0 540 960" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="url(#gold)" stroke-linecap="round">
          <rect class="draw" pathLength="1" x="16" y="16" width="508" height="928" rx="4" stroke-width="2.2"/>
          <rect class="draw d2" pathLength="1" x="26" y="26" width="488" height="908" rx="2" stroke-width=".9"/>
        </g>
      </svg>
      <!-- corner motifs -->
      <svg class="corner c-tl" viewBox="0 0 120 120" aria-hidden="true"><use href="#cornerArt"/></svg>
      <svg class="corner c-tr" viewBox="0 0 120 120" aria-hidden="true"><use href="#cornerArt"/></svg>
      <svg class="corner c-bl" viewBox="0 0 120 120" aria-hidden="true"><use href="#cornerArt"/></svg>
      <svg class="corner c-br" viewBox="0 0 120 120" aria-hidden="true"><use href="#cornerArt"/></svg>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <g id="cornerArt" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 70C12 36 36 12 70 12"/>
            <path d="M12 96C12 50 50 12 96 12" stroke-width=".9"/>
            <!-- paisley -->
            <path d="M30 30c14-8 30 0 30 14 0 10-9 16-17 13-7-3-7-12 0-13" />
            <circle cx="44" cy="44" r="2.2" fill="url(#gold)" stroke="none"/>
            <!-- lotus buds along the curves -->
            <path d="M12 70c-5 5-5 11 0 15 5-4 5-10 0-15z" fill="url(#gold)" stroke="none"/>
            <path d="M70 12c5-5 11-5 15 0-4 5-10 5-15 0z" fill="url(#gold)" stroke="none"/>
            <circle cx="16" cy="16" r="3" fill="url(#gold)" stroke="none"/>
          </g>
        </defs>
      </svg>

      <!-- mandala (built by script) -->
      <svg class="mandala" id="mandala" viewBox="-100 -100 200 200" aria-hidden="true"></svg>

      <!-- Scene A: names -->
      <section class="scene s-names" id="sNames">
        <p class="kicker" id="kicker">Save the Date</p>
        <p class="wed-of" id="wedOf">for the wedding of</p>
        <h1 class="names">
          <span class="gold-text name" id="nameA">Harsh</span>
          <span class="amp" id="amp">&amp;</span>
          <span class="gold-text name" id="nameB">Stuti</span>
        </h1>
        <svg class="rule" id="rule1" viewBox="0 0 300 24" aria-hidden="true"><use href="#ruleArt"/></svg>
        <p class="tagline" id="tagline1">two hearts, one beautiful journey</p>
      </section>

      <!-- Scene B: painting in a gold arch -->
      <section class="scene s-arch" id="sArch">
        <div class="arch" id="arch">
          <div class="arch__img"><img src="assets/temple-couple.jpg" alt="Harsh and Stuti at the Jain temple" /></div>
          <svg class="arch__line" viewBox="0 0 400 520" preserveAspectRatio="none" aria-hidden="true">
            <path class="draw" pathLength="1" fill="none" stroke="url(#gold)" stroke-width="3"
              d="M2 518V189C2 104 90 52 160 31 180 26 192 16 200 2 208 16 220 26 240 31 310 52 398 104 398 189V518Z"/>
            <path class="draw d2" pathLength="1" fill="none" stroke="url(#gold)" stroke-width="1.2"
              d="M-10 530V186C-10 96 84 40 156 19 176 14 190 6 200 -10 210 6 224 14 244 19 316 40 410 96 410 186V530Z"/>
          </svg>
        </div>
      </section>

      <!-- Finale: logo + hashtag (painting shrinks to the top) -->
      <section class="finale" id="finale">
        <div class="logo" id="logoMain">
          <svg class="logo__mark" viewBox="0 0 380 300" aria-label="H and S monogram">
            <g class="logo__swirl" fill="none" stroke="url(#goldSoft)" stroke-linecap="round">
              <path pathLength="1" stroke-width="1.6" d="M70 200C70 168 112 150 150 162 182 172 176 206 146 210 118 214 104 192 124 178 150 160 205 168 236 196 262 220 300 236 330 232"/>
              <path pathLength="1" stroke-width="1.1" d="M226 196L338 258"/>
            </g>
            <text class="logo__H" x="150" y="196" text-anchor="middle">H</text>
            <text class="logo__S" x="262" y="232" text-anchor="middle" fill="url(#gold)">S</text>
            <g transform="translate(16 8)"><path class="logo__heart" d="M206 150c-9-7-15-12-15-19 0-4 3-8 8-8 3 0 6 2 7 5 1-3 4-5 7-5 5 0 8 4 8 8 0 7-6 12-15 19z" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linejoin="round"/></g>
          </svg>
        </div>
        <div class="tag-glow" id="tagGlow"></div>
        <p class="hashtag" aria-label="#HarshgotStutified">
          <span class="ht ht-a gold-text" id="htA">#Harsh</span>
          <span class="ht ht-b" id="htB">got</span>
          <span class="ht ht-c gold-text" id="htC">Stutified</span>
        </p>
        <p class="tag-date" id="tagDate">30 <span>·</span> November <span>·</span> 2026</p>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </section>

      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <g id="ruleArt" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round">
            <path d="M128 12H24C16 12 12 6 18 4M24 12C18 12 14 18 20 20"/>
            <path d="M172 12H276C284 12 288 6 282 4M276 12C282 12 286 18 280 20"/>
            <path d="M150 4l8 8-8 8-8-8z" fill="url(#gold)" stroke="none"/>
            <circle cx="132" cy="12" r="1.8" fill="url(#gold)" stroke="none"/><circle cx="168" cy="12" r="1.8" fill="url(#gold)" stroke="none"/>
          </g>
        </defs>
      </svg>

      <!-- floating gold dust -->
      <div class="dust" id="dust" aria-hidden="true"></div>

      <button class="replay" id="replayBtn" type="button" aria-label="Replay">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></svg>
        <span>Replay</span>
      </button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
